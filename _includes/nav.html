<nav>
    <a class="nav-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/bmc-logo.png' | relative_url }}" alt="BMCircuits">
    </a>
  
    <!-- Hamburger button (mobile only) -->
    <button class="nav-hamburger" onclick="toggleMenu()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  
    <!-- Nav links -->
    <ul class="nav-links" id="nav-links">
      <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>About</a></li>
      <li><a href="{{ '/portfolio/' | relative_url }}" {% if page.url contains '/portfolio' %}class="active"{% endif %}>Portfolio</a></li>
      <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' or page.layout == 'post' %}class="active"{% endif %}>Blog</a></li>
      <li><a href="{{ '/contact/' | relative_url }}" class="nav-cta" {% if page.url contains '/contact' %}style="opacity:0.8"{% endif %}>Contact</a></li>
    </ul>
  </nav>
  
  <script>
    function toggleMenu() {
      const links = document.getElementById('nav-links');
      const burger = document.querySelector('.nav-hamburger');
      links.classList.toggle('open');
      burger.classList.toggle('open');
    }
  
    // Close menu when a link is clicked
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('nav-links').classList.remove('open');
        document.querySelector('.nav-hamburger').classList.remove('open');
      });
    });
  </script>
