---
layout: default
---
<div class="post-layout">
  <a href="{{ '/blog/' | relative_url }}" class="post-back">← Back to posts</a>

  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    <span>{{ page.date | date: "%b %Y" }}</span>
    {% if page.read_time %}<span>{{ page.read_time }}</span>{% endif %}
    {% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}
  </div>

  <div class="post-content-wrap">
    <div class="post-body">
        {{ content }}
    </div>

  <!-- Share section -->
  <div class="post-share">
    <p class="post-share-label">Share this post</p>
    <div class="post-share-links">  
        <!-- Copy link -->
        <button class="share-btn" onclick="copyLink()" id="copy-btn" aria-label="Copy link">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
                <path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" stroke="currentColor" stroke-width="1.25"/>
            </svg>
            <span>Copy link</span>
        </button>  
        <!-- Email -->
        <a class="share-btn" 
        href="mailto:?subject={{ page.title | uri_escape }}&body=Thought you might find this interesting: {{ page.url | absolute_url }}" 
        aria-label="Share via email">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
                <polyline points="1,3 8,9 15,3" stroke="currentColor" stroke-width="1.25" fill="none" stroke-linejoin="round"/>
            </svg>
            <span>Email</span>
        </a>  
        <!-- LinkedIn -->
        <a class="share-btn" 
        href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | uri_escape }}" 
        target="_blank" rel="noopener" aria-label="Share on LinkedIn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
            <span>LinkedIn</span>
        </a>  
        <!-- X / Twitter -->
        <a class="share-btn" 
        href="https://x.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ page.url | absolute_url | uri_escape }}" 
        target="_blank" rel="noopener" aria-label="Share on X">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
            <span>X</span>
        </a>  
        <!-- Reddit -->
        <a class="share-btn" 
        href="https://reddit.com/submit?url={{ page.url | absolute_url | uri_escape }}&title={{ page.title | uri_escape }}" 
        target="_blank" rel="noopener" aria-label="Share on Reddit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/>
          </svg>
            <span>Reddit</span>
        </a>  
    </div>
</div>

<script>
    function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            const btn = document.getElementById('copy-btn');
            const span = btn.querySelector('span');
            span.textContent = 'Copied!';
            btn.style.color = 'var(--gold)';
            btn.style.borderColor = 'var(--gold)';
            setTimeout(() => {
                span.textContent = 'Copy link';
                btn.style.color = '';
                btn.style.borderColor = '';
            }, 2000);
        });
    }
    </script>
