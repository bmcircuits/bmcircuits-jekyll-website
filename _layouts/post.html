---
layout: default
---
<div class="post-layout">
  <a href="{{ '/blog/' | relative_url }}" class="post-back">← Back to posts</a>

  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    <span>{{ page.date | date: "%b %Y" }}</span>
    {% if page.read_time %}<span>{{ page.read_time }}</span>{% endif %}
    {% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}
  </div>

  <div class="post-content-wrap">
    <div class="post-body">
        {{ content }}
    </div>

  <!-- Share section -->
  <div class="post-share">
    <p class="post-share-label">Share this post</p>
    <div class="post-share-links">  
        <!-- Copy link -->
        <button class="share-btn" onclick="copyLink()" id="copy-btn" aria-label="Copy link">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
                <path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" stroke="currentColor" stroke-width="1.25"/>
            </svg>
            <span>Copy link</span>
        </button>  
        <!-- Email -->
        <a class="share-btn" 
        href="mailto:?subject={{ page.title | uri_escape }}&body=Thought you might find this interesting: {{ page.url | absolute_url }}" 
        aria-label="Share via email">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
                <polyline points="1,3 8,9 15,3" stroke="currentColor" stroke-width="1.25" fill="none" stroke-linejoin="round"/>
            </svg>
            <span>Email</span>
        </a>  
        <!-- LinkedIn -->
        <a class="share-btn" 
        href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | uri_escape }}" 
        target="_blank" rel="noopener" aria-label="Share on LinkedIn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="1" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.25"/>
                <line x1="4.5" y1="6.5" x2="4.5" y2="11.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                <circle cx="4.5" cy="4.5" r="0.75" fill="currentColor"/>
                <path d="M7.5 11.5V8.5C7.5 7.4 8.4 6.5 9.5 6.5S11.5 7.4 11.5 8.5v3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            </svg>
            <span>LinkedIn</span>
        </a>  
        <!-- X / Twitter -->
        <a class="share-btn" 
        href="https://x.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ page.url | absolute_url | uri_escape }}" 
        target="_blank" rel="noopener" aria-label="Share on X">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M12.5 2h2l-4.5 5.1L15 14h-3.5l-3-4-3.5 4H2.5l4.8-5.5L1.5 2H5l2.7 3.6L12.5 2z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
            </svg>
            <span>X</span>
        </a>  
        <!-- Facebook -->
        <a class="share-btn" 
        href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | uri_escape }}" 
        target="_blank" rel="noopener" aria-label="Share on Facebook">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.25"/>
                <path d="M9.5 5H8.5C8 5 7.5 5.5 7.5 6v1.5H6.5V9h1v5h2V9h1.5l.5-1.5H9.5V6.5c0-.3.2-.5.5-.5H11V5h-1.5z" stroke="currentColor" stroke-width="1" fill="none" stroke-linejoin="round"/>
            </svg>
            <span>Facebook</span>
        </a>  
        <!-- Reddit -->
        <a class="share-btn" 
        href="https://reddit.com/submit?url={{ page.url | absolute_url | uri_escape }}&title={{ page.title | uri_escape }}" 
        target="_blank" rel="noopener" aria-label="Share on Reddit">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.25"/>
                <circle cx="5.5" cy="9" r="1" stroke="currentColor" stroke-width="1"/>
                <circle cx="10.5" cy="9" r="1" stroke="currentColor" stroke-width="1"/>
                <path d="M5.5 11.5s.5 1 2.5 1 2.5-1 2.5-1" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                <circle cx="11.5" cy="4.5" r="1" stroke="currentColor" stroke-width="1"/>
                <line x1="8" y1="4" x2="11" y2="4.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
            </svg>
            <span>Reddit</span>
        </a>  
    </div>
</div>

<script>
    function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            const btn = document.getElementById('copy-btn');
            const span = btn.querySelector('span');
            span.textContent = 'Copied!';
            btn.style.color = 'var(--gold)';
            btn.style.borderColor = 'var(--gold)';
            setTimeout(() => {
                span.textContent = 'Copy link';
                btn.style.color = '';
                btn.style.borderColor = '';
            }, 2000);
        });
    }
    </script>
