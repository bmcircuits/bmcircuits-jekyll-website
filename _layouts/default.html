<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    <link rel="manifest" href="{{ '/assets/images/site.webmanifest' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "ProfessionalService",
          "name": "BMCircuits",
          "alternateName": "BMC",
          "description": "Sydney-based electronic design house offering PCB design, embedded systems, firmware development, and production testing.",
          "url": "https://bmcircuits.com",
          "email": "info@bmcircuits.com",
          "logo": "https://bmcircuits.com/assets/images/bmc-logo.png",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Sydney",
            "addressRegion": "New South Wales",
            "addressCountry": "AU"
          },
          "areaServed": [
            "Australia",
            "Global"
          ],
          "serviceType": [
            "PCB Design",
            "Embedded Systems Design",
            "Firmware Development",
            "CAD Enclosure Design",
            "Production Test Fixture Development"
          ],
          "knowsAbout": [
            "PCB Design",
            "KiCad",
            "STM32",
            "Raspberry Pi",
            "Embedded Linux",
            "Firmware Development",
            "C Programming",
            "RTOS",
            "I2C",
            "SPI",
            "CAN Bus",
            "USB",
            "SolidWorks",
            "Sheet Metal Design",
            "DFM"
          ]
        }
        </script>
    </head>

  {% include nav.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
